name: lifelynk_ai
description: LifeLynk AI - Pakistan's National Digital Blood Infrastructure

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^16.2.1

  # Environment
  flutter_dotenv: ^6.0.0

    # AI Voice
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.3

  # HTTP
  dio: ^5.9.0
  

  # Supabase
  supabase_flutter: ^2.10.1

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # State Management
  flutter_riverpod: ^2.6.1

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Connectivity
  connectivity_plus: ^7.0.0

  flutter_map: ^8.3.2
  latlong2: ^0.10.1


  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Image Cache
  cached_network_image: ^3.4.1

  # SVG
  flutter_svg: ^2.2.0

  # Loading
  flutter_spinkit: ^5.2.2

  # Formatting
  intl: ^0.20.2

  # UUID
  uuid: ^4.5.1

  # Animations
  lottie: ^3.3.2
  flutter_animate: ^4.5.0

  # Fonts
  google_fonts: ^6.3.1

  # Local Storage
  shared_preferences: ^2.5.3

  # OTP
  pinput: ^5.0.1

  # Google Authentication
  google_sign_in: ^7.2.0

  # Image Picker
  image_picker: ^1.1.2

  # Dropdown
  dropdown_search: ^6.0.2

  # Permissions
  permission_handler: ^12.0.1

  # URL / Maps
  url_launcher: ^6.3.2

  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.4

  # Code Generation
  build_runner: ^2.6.0
  freezed: ^3.2.3
  json_serializable: ^6.11.1

# ============================================================
# App Icon Configuration
# ============================================================

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/app_icon.png"

  min_sdk_android: 21

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"

# ============================================================
# Flutter
# ============================================================

flutter:
  uses-material-design: true

  assets:
    - assets/data/pakistan_locations.json
    - assets/images/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/icons/
    - assets/animations/
    - .env